name: verify

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Δομικός έλεγχος — index.html
        run: node tools/verify.js index.html
      - name: Δομικός έλεγχος — writing-prompt-generator.html
        run: node tools/verify.js writing-prompt-generator.html
      - name: Τα δύο αρχεία είναι ταυτόσημα
        run: cmp index.html writing-prompt-generator.html
